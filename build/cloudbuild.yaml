# Pipeline de CI/CD para Google Cloud Build:
# 1. Construye imagen de contenedor con Buildx y caché remota en Artifact Registry.
# 2. La suite de tests corre dentro de build/Dockerfile (etapa builder), abortando el deploy si falla.
# 3. Despliega en Google Cloud Run de forma idempotente.
steps:
  - id: "Building container image"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - -c
      - |
        docker buildx create --use &&
        docker buildx build \
          --cache-from=type=registry,ref=$_ARTIFACT_REGISTRY/$_CACHE:cache \
          --cache-to=type=registry,ref=$_ARTIFACT_REGISTRY/$_CACHE:cache,mode=max \
          --push \
          -t $_ARTIFACT_REGISTRY/$_SERVICE_NAME:$COMMIT_SHA \
          -f build/Dockerfile .

  # 2. Deploy to Cloud Run
  - id: "deploy-service"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image=$_ARTIFACT_REGISTRY/$_SERVICE_NAME:$COMMIT_SHA"
      - "--service-account=$SERVICE_ACCOUNT_EMAIL"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu-boost"
      # default envs
      - "--set-env-vars=SERVICE_ENV=$_SERVICE_ENV"
      - "--set-env-vars=SERVICE_NAME=$_SERVICE_NAME"
      - "--set-env-vars=PROJECT_ID=$PROJECT_ID"
      - "--set-env-vars=DEBUG_LEVEL=$_DEBUG_LEVEL"
      # env vars from substitutions
      - "--set-env-vars=MONGO_DB=$_MONGO_DB"
      - "--set-secrets=^##^MONGO_URL=$_MONGO_URL"

substitutions:
  _CACHE: "service-name-cache"
  _SERVICE_ENV: "PRD"
  _ARTIFACT_REGISTRY: "us-docker.pkg.dev/$PROJECT_ID/artifacts"
  _REGION: "us-central1"

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

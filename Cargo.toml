[workspace]
members = ["engine", "service"]
default-members = ["engine", "service"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
axum_typed_multipart = { version = "0.16", default-features = false }
bson = { version = "3", features = ["chrono-0_4", "serde", "serde_json-1"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"
futures = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
mongodb = { version = "3.9", default-features = false, features = [
  "bson-3",
  "compat-3-3-0",
  "rustls-tls",
  "dns-resolver",
] }
opentelemetry = "0.32"
opentelemetry-gcloud-trace = { version = "0.27", default-features = false, features = [
  "tls-webpki-roots",
] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = "0.32"
redis = { version = "1", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "json",
  "rustls-no-provider",
] }
reqwest-middleware = { version = "0.5", features = ["json", "query"] }
reqwest-tracing = { version = "0.7", features = ["opentelemetry_0_32"] }
rmp-serde = "1.3"
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "decompression-gzip"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
validator = { version = "0.21", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
codegen-units = 16

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 3
